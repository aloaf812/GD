name: Build Android Binaries

on:
  push:
    branches:
      - 1.7

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout cocos2d-x
      uses: actions/checkout@v4
      with:
        repository: aloaf812/cocos2d-x
        submodules: recursive

    - name: Setup Android NDK
      run: |
        pwd
        wget https://github.com/decompme/compilers/releases/download/compilers/android-ndk-r8e-linux-x86_64-gcc-4.4.3.tar.bz2
        tar -xjf android-ndk-r8e-linux-x86_64-gcc-4.4.3.tar.bz2
        ls

    - name: Run Build Script
      run: |
        cd /home/runner/work/GD/GD/projects/GD/proj.android
        sed -i '1c\APP_ABI := x86' jni/Application.mk
        chmod +x ./build_native.sh
        ./build_native.sh
      env:
        NDK_ROOT: /home/runner/work/GD/GD/android-ndk-r8e        
 
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        path: |
          /home/runner/work/GD/GD/projects/GD/proj.android/libs/x86/libcocos2dcpp.so